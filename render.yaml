services:
  # -------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # -------------------------------------------------------------
  - type: web
    name: web-based-crm
    env: python
    region: singapore
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: API_V1_STR
        value: /api/v1
      - key: PROJECT_NAME
        value: REALVION - Real Estate Sales Operating System
      - key: SECRET_KEY
        generateValue: true
      - key: REFRESH_SECRET_KEY
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: DATABASE_URL
        sync: false

  # -------------------------------------------------------------
  # 2. React Vite Frontend CRM Web App
  # -------------------------------------------------------------
  - type: static
    name: realvion-frontend
    region: singapore
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://web-based-crm.onrender.com/api/v1
      - key: VITE_SENTRY_DSN
        sync: false


  # -------------------------------------------------------------
  # 3. Standalone REALVION Official Company Website
  # -------------------------------------------------------------
  - type: static
    name: realvion-website
    region: singapore
    plan: free
    buildCommand: cd website && npm install && npm run build
    staticPublishPath: website/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
