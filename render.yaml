services:
  # -------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # -------------------------------------------------------------
  - type: web
    name: brokeros-backend
    env: python
    region: singapore
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: API_V1_STR
        value: /api/v1
      - key: PROJECT_NAME
        value: BrokerOS Lite Real Estate CRM
      - key: SECRET_KEY
        value: brokeros_render_production_jwt_secret_key_2026

  # -------------------------------------------------------------
  # 2. React Vite Frontend CRM Web App
  # -------------------------------------------------------------
  - type: static
    name: brokeros-frontend
    region: singapore
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://web-based-crm.onrender.com/api/v1

  # -------------------------------------------------------------
  # 3. Standalone BrokerOS Official Company Website
  # -------------------------------------------------------------
  - type: static
    name: brokeros-website
    region: singapore
    plan: free
    buildCommand: cd website && npm install && npm run build
    staticPublishPath: website/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
